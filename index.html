<!DOCTYPE html> <!-- Определяет тип документа как HTML5 -->
<html lang="en"> <!-- Начало HTML-документа с указанием языка (английский) -->

<head>
    <meta charset="UTF-8"> <!-- Устанавливает кодировку документа на UTF-8 -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge"> <!-- Указывает браузеру использовать режим совместимости с IE -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Устанавливает параметры для адаптивного дизайна -->
    <link rel="stylesheet" href="style.css"> <!-- Подключает внешний файл стилей (CSS) -->
    <title>Card</title> <!-- Устанавливает заголовок страницы, который отображается на вкладке браузера -->
</head>

<body>

    <div class="container"> <!-- Контейнер для всей карточки -->
        <div class="card"> <!-- Основной блок карточки -->
            <div class="header"> <!-- Заголовок карточки -->
                <h3 class="title">Payment Details</h3> <!-- Заголовок с текстом "Payment Details" -->
                <svg xmlns="http://www.w3.org/2000/svg" class="logo" width="140" height="43" viewBox="0 0 175.7 53.9"> <!-- Встраиваемая SVG-графика для логотипа -->
                    <style>
                        .visa { <!-- Определение стиля для класса "visa" -->
                            fill: #fff; <!-- Устанавливает цвет заливки для элементов с классом "visa" на белый -->
                        }
                    </style>
                    <path class="visa" d="M61.9 53.1l8.9-52.2h14.2l-8.9 52.2zm65.8-50.9c-2.8-1.1-7.2-2.2-12.7-2.2-14.1 0-24 7.1-24 17.2-.1 7.5 7.1 11.7 12.5 14.2 5.5 2.6 7.4 4.2 7.4 6.5 0 3.5-4.4 5.1-8.5 5.1-5.7 0-8.7-.8-13.4-2.7l-2-.9-2 11.7c3.3 1.5 9.5 2.7 15.9 2.8 15 0 24.7-7 24.8-17.8.1-5.9-3.7-10.5-11.9-14.2-5-2.4-8-4-8-6.5 0-2.2 2.6-4.5 8.1-4.5 4.7-.1 8 .9 10.6 2l1.3.6 1.9-11.3M164.2 1h-11c-3.4 0-6 .9-7.5 4.3l-21.1 47.8h14.9s2.4-6.4 3-7.8h18.2c.4 1.8 1.7 7.8 1.7 7.8h13.2l-11.4-52.1m-17.5 33.6c1.2-3 5.7-14.6 5.7-14.6-.1.1 1.2-3 1.9-5l1 4.5s2.7 12.5 3.3 15.1h-11.9zm-96.7-33.7l-14 35.6-1.5-7.2c-2.5-8.3-10.6-17.4-19.6-21.9l12.7 45.7h15.1l22.4-52.2h-15.1" /> <!-- Путь для рисования логотипа Visa -->
                    <path fill="#F7A600" d="M23.1.9h-22.9l-.2 1.1c17.9 4.3 29.7 14.8 34.6 27.3l-5-24c-.9-3.3-3.4-4.3-6.5-4.4" /> <!-- Путь для рисования части логотипа Visa с цветом #F7A600 -->
                </svg> <!-- Закрытие тега SVG -->

            </div> <!-- Закрытие блока заголовка карточки -->

            <div class="content"> <!-- Блок содержимого карточки -->
                <div class="row"> <!-- Строка для ввода номера карты -->
                    <label>Card Number</label> <!-- Метка для поля ввода номера карты -->
                    <input type="text" class="card-number" placeholder="1234 1234 1234 1234"> <!-- Поле ввода для номера карты с плейсхолдером -->
                </div> <!-- Закрытие строки ввода номера карты -->

                <div class="row card-expire"> <!-- Строка для ввода даты истечения карты -->
                    <div class="row card-expire-month"> <!-- Строка для ввода месяца истечения -->
                        <label>Month</label> <!-- Метка для поля ввода месяца -->
                        <input type="text" placeholder="April"> <!-- Поле ввода для месяца с плейсхолдером -->
                    </div> <!-- Закрытие строки ввода месяца -->

                    <div class="row card-expire-year"> <!-- Строка для ввода года истечения -->
                        <label>Year</label> <!-- Метка для поля ввода года -->
                        <input type="text" placeholder="2022"> <!-- Поле ввода для года с плейсхолдером -->
                    </div> <!-- Закрытие строки ввода года -->
                </div> <!-- Закрытие строки для ввода даты истечения -->

                <div class="row card-cvv"> <!-- Строка для ввода CVV-кода -->
                    <label>CVV</label> <!-- Метка для поля ввода CVV -->
                    <input type="text" placeholder="248"> <!-- Поле ввода для CVV-кода с плейсхолдером -->
                </div> <!-- Закрытие строки ввода CVV -->

            </div> <!-- Закрытие блока содержимого карточки -->

        </div> <!-- Закрытие основного блока карточки -->
    </div> <!-- Закрытие контейнера -->

</body>

</html> <!-- Закрытие HTML-документа -->
